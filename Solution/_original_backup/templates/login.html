{% extends "base.html" %}

{% block nav %}
{% include "includes/front_nav.html" %}
{% endblock %}


{% block content %}


<blockquote class="blockquote text-center py-5">
    <h1 class="mb-0 display-4 text-uppercase">Login Form</h1>
    <footer class="blockquote-footer">Booking of Medical Appointment</footer>
</blockquote>


<div class="card mb-5">
    <div class="card-body">
        
<form action="{{ url_for('sign_in') }}" method="post">




    <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" name="email" id="email" required class="form-control">
    </div>

    <div class="form-group">
        <label for="password">Your Password</label>
        <input type="password" name="password" id="password" required class="form-control">
    </div>


    <input type="submit" name="submit" value="Login" class="btn btn-dark">


</form>


{% if message %}
<h4 class="alert alert-warning">{{ message }}</h4>
{% endif %}

{% endblock %}
</div>
</div>
