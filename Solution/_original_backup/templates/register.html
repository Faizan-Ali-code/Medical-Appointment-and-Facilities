{% extends "base.html" %}

{% block nav %}
{% include "includes/front_nav.html" %}
{% endblock %}


{% block content %}


<blockquote class="blockquote text-center py-5">
    <h1 class="mb-0 display-4 text-uppercase">Register Form</h1>
    <footer class="blockquote-footer">Booking of Medical Appointment</footer>
</blockquote>



<div class="card mb-5">
    <div class="card-body">
<form action="{{ url_for('sign_up') }}" method="post">


    <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" name="name" id="name" required class="form-control">
    </div>


    <div class="form-group">
        <label for="eamil">Your Email</label>
        <input type="email" name="email" id="email" required class="form-control">
    </div>

    <div class="form-group">
        <label for="password">Your Password</label>
        <input type="password" name="password" id="password" required class="form-control">
    </div>


    <div class="form-group">
        <label for="phone">Your Phone</label>
        <input type="number" name="phone" id="phone" required class="form-control">
    </div>

    <div class="form-group">
        <label for="city">Your City</label>
        <input type="text" name="city" id="city" required class="form-control">
    </div>


    <div class="form-group">
        <label for="role">Your Role</label>
        <select name="role" id="role" required class="form-control">
            <option value="" disabled selected>Choose</option>
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>
    </div>


    <input type="submit" name="submit" value="Register" class="btn btn-dark">


</form>


{% if message %}
<h4 class="alert alert-primary">{{ message }}</h4>
{% endif %}

{% endblock %}

</div>
</div>
