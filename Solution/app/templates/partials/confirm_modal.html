{# Shared confirmation dialog. Any form with data-confirm="..." opens it before submitting (see static/js/app.js). #}
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="confirmModalTitle"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Please confirm</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" data-confirm-text>Are you sure?</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" data-confirm-ok>Yes, continue</button>
      </div>
    </div>
  </div>
</div>
